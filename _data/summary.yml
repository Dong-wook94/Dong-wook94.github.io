# Summary 섹션 데이터
summary: |
  6년 차 백엔드 개발자로서, 
  카드사·간편결제사 등 40개 이상의 금융기관과 연동된 대규모 결제 시스템을 설계하고 운영했습니다. 
  **복잡한 다중 트랜잭션 환경에서도 데이터 정합성을 보장하고, 유연한 아키텍처를 구축하여 시스템 확장성을 확보**하는 데 강점이 있습니다.

  단순한 기능 구현을 넘어 구조적 문제 해결에 집중합니다.
   **잠재적 장애 요소를 사전에 차단하는 방어 로직과 테스트 자동화 환경을 구축하여, 2025년 장애 발생률 0%를 달성**했습니다. 
   망분리 환경 내 LLM 챗봇 도입 등 개발 생산성을 높이는 인프라 개선에도 주도적으로 기여하며, 기술로 조직의 비효율을 혁신해왔습니다.