# Summary 섹션 데이터
summary: |
  결제 도메인 6년차 백엔드 개발자로,
  
  **가맹점 대상 카드사·간편결제사·쿠폰·포인트 등 결제 서비스 40건 이상을 설계·개발·운영**했습니다.
  
  **다중 트랜잭션, 가변 전문, 대규모 승인 트래픽 환경에서 장애를 구조적으로 해결하고, 확장 가능한 아키텍처를 설계하는 데 강점**이 있습니다.
  
  최근에는 **망분리 환경용 LLM 챗봇 및 테스트 자동화 도구를 직접 설계·개발**함으로써 개발 생산성과 테스트 인프라를 보완했습니다. 이를 통해, **2025년 승인 서버 내 반영 건수 대비 장애 발생율을 0%로 만드는 데 기여**했습니다(전년도 1.2%).
